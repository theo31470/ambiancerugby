<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Signature mail</title>
<style>body{margin:0;padding:32px 16px;background:#fcf7f8;font-family:Arial,Helvetica,sans-serif;color:#2a1419}.boite{max-width:620px;margin:0 auto}.carte{background:#fff;border:1px solid #ecd9dd;border-radius:16px;padding:24px}button{margin-top:16px;font:700 16px Arial,sans-serif;background:#934f5e;color:#fff;border:0;border-radius:999px;padding:12px 22px;cursor:pointer}p.aide{color:#7a6166;font-size:14px;line-height:1.5}</style></head>
<body><div class="boite">
<div class="carte" id="sig">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#2a1419;max-width:560px">
<tr><td style="padding:0 0 14px 0">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr>
<td style="padding:0 18px 0 0;vertical-align:top"><a href="https://ambiance-rugby.fr" style="text-decoration:none"><img src="https://ambiance-rugby.fr/signature/logo.png" width="104" height="104" alt="Ambiance Rugby" style="display:block;border:0;width:104px;height:104px"></a></td>
<td style="padding:0 0 0 18px;border-left:3px solid #f2b53a;vertical-align:top">
<img src="https://ambiance-rugby.fr/signature/nom.png" width="177" height="36" alt="Théo Sarrat" style="display:block;border:0;width:177px;height:36px">
<div style="font-size:14px;line-height:19px;color:#934f5e;font-weight:bold;padding-top:2px">Président et cofondateur</div>
<div style="font-size:13px;line-height:18px;color:#7a6166;padding-bottom:8px">Ambiance Rugby, le rugby côté tribune</div>
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse">
<tr><td style="padding:3px 8px 3px 0;vertical-align:middle"><img src="https://ambiance-rugby.fr/signature/site.png" width="22" height="22" alt="" style="display:block;border:0"></td><td style="padding:3px 0;vertical-align:middle;font-size:14px;line-height:18px"><a href="https://ambiance-rugby.fr" style="color:#3e1621;text-decoration:none;font-weight:bold">ambiance-rugby.fr</a></td></tr>
<tr><td style="padding:3px 8px 3px 0;vertical-align:middle"><img src="https://ambiance-rugby.fr/signature/insta.png" width="22" height="22" alt="" style="display:block;border:0"></td><td style="padding:3px 0;vertical-align:middle;font-size:14px;line-height:18px"><a href="https://www.instagram.com/ambiancerugbyy/" style="color:#3e1621;text-decoration:none;font-weight:bold">@ambiancerugbyy</a></td></tr>
</table>
</td></tr></table>
</td></tr>
<tr><td style="padding:0 0 12px 0"><table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse"><tr><td style="padding:0 6px 0 0"><span style="display:inline-block;background:#f6e4e8;color:#934f5e;font-size:12px;font-weight:bold;line-height:16px;padding:4px 10px;border-radius:999px;white-space:nowrap">Scores en direct</span></td><td style="padding:0 6px 0 0"><span style="display:inline-block;background:#f6e4e8;color:#934f5e;font-size:12px;font-weight:bold;line-height:16px;padding:4px 10px;border-radius:999px;white-space:nowrap">Classements</span></td><td style="padding:0 6px 0 0"><span style="display:inline-block;background:#f6e4e8;color:#934f5e;font-size:12px;font-weight:bold;line-height:16px;padding:4px 10px;border-radius:999px;white-space:nowrap">Pronos</span></td><td style="padding:0 6px 0 0"><span style="display:inline-block;background:#f6e4e8;color:#934f5e;font-size:12px;font-weight:bold;line-height:16px;padding:4px 10px;border-radius:999px;white-space:nowrap">Stats joueurs</span></td></tr></table></td></tr>
<tr><td><a href="https://ambiance-rugby.fr" style="text-decoration:none"><img src="https://ambiance-rugby.fr/signature/banniere.png" width="560" height="150" alt="Le Top 14 et la Pro D2 en direct sur ambiance-rugby.fr" style="display:block;border:0;width:100%;max-width:560px;height:auto"></a></td></tr>
</table>
</div>
<button onclick="copier()">Copier la signature</button>
<p class="aide" id="msg">Puis colle-la dans les réglages de signature de ta messagerie (Gmail, Outlook, Mail sur iPhone).</p>
</div>
<script>
async function copier(){var el=document.getElementById("sig");var html=el.innerHTML;var m=document.getElementById("msg");
try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([el.innerText],{type:"text/plain"})})]);m.textContent="Copiée ! Colle-la dans les réglages de signature de ta messagerie.";}
catch(e){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy");m.textContent="Signature sélectionnée et copiée. Colle-la dans les réglages de ta messagerie.";}}
</script>
</body></html>
