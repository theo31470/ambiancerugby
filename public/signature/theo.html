<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Signature mail</title>
<style>body{margin:0;padding:32px 16px;background:#fcf7f8;font-family:Arial,Helvetica,sans-serif;color:#2a1419}.boite{max-width:560px;margin:0 auto}.carte{background:#fff;border:1px solid #ecd9dd;border-radius:16px;padding:24px}button{margin-top:16px;font:700 16px Arial,sans-serif;background:#934f5e;color:#fff;border:0;border-radius:999px;padding:12px 22px;cursor:pointer}p.aide{color:#7a6166;font-size:14px;line-height:1.5}</style></head>
<body><div class="boite">
<div class="carte" id="sig">
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#2a1419">
<tr>
<td style="padding:0 16px 0 0;vertical-align:middle"><a href="https://ambiance-rugby.fr" style="text-decoration:none"><img src="https://ambiance-rugby.fr/signature/logo.png" width="90" height="90" alt="Ambiance Rugby" style="display:block;border:0;width:90px;height:90px"></a></td>
<td style="padding:0 0 0 16px;border-left:3px solid #f2b53a;vertical-align:middle">
<div style="font-size:18px;font-weight:bold;line-height:22px;color:#2a1419">Théo Sarrat</div>
<div style="font-size:14px;line-height:20px;color:#934f5e;font-weight:bold">Président, Ambiance Rugby</div>
<div style="font-size:13px;line-height:20px;color:#7a6166;font-style:italic;padding-bottom:6px">Le rugby côté tribune</div>
<div style="font-size:13px;line-height:20px"><a href="https://ambiance-rugby.fr" style="color:#3e1621;text-decoration:none;font-weight:bold">ambiance-rugby.fr</a>&nbsp;&nbsp;<span style="color:#ecd9dd">|</span>&nbsp;&nbsp;<a href="https://www.instagram.com/ambiancerugbyy/" style="color:#3e1621;text-decoration:none">Instagram @ambiancerugbyy</a></div>
</td></tr></table>
</div>
<button onclick="copier()">Copier la signature</button>
<p class="aide" id="msg">Puis colle-la dans les réglages de signature de ta messagerie (Gmail, Outlook, Mail sur iPhone).</p>
</div>
<script>
async function copier(){var el=document.getElementById("sig");var html=el.innerHTML;var m=document.getElementById("msg");
try{await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([el.innerText],{type:"text/plain"})})]);m.textContent="Copiée ! Colle-la dans les réglages de signature de ta messagerie.";}
catch(e){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy");m.textContent="Signature sélectionnée et copiée. Colle-la dans les réglages de ta messagerie.";}}
</script>
</body></html>
