<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3e1621" />
  <title>Hors ligne · Ambiance Rugby</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #3e1621; color: #fcf7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      box-sizing: border-box; overflow: hidden;
    }
    /* lignes du terrain */
    .terrain { position: fixed; inset: 0; pointer-events: none;
      background:
        linear-gradient(transparent calc(22% - 1px), rgba(255,255,255,.07) 22%, transparent calc(22% + 1px)),
        linear-gradient(transparent calc(50% - 1px), rgba(255,255,255,.09) 50%, transparent calc(50% + 1px)),
        linear-gradient(transparent calc(78% - 1px), rgba(255,255,255,.07) 78%, transparent calc(78% + 1px)); }
    main { position: relative; max-width: 360px; }
    .logo { width: 150px; margin: 0 auto 34px; display: block; animation: rebond 1.6s ease-in-out infinite; }
    @keyframes rebond {
      0%, 100% { transform: translateY(0) rotate(-10deg); }
      50% { transform: translateY(-16px) rotate(8deg); }
    }
    .ombre { width: 90px; height: 10px; margin: -26px auto 30px; border-radius: 50%; background: rgba(0,0,0,.35);
      animation: ombre 1.6s ease-in-out infinite; }
    @keyframes ombre { 0%, 100% { transform: scaleX(1); opacity: .5; } 50% { transform: scaleX(.6); opacity: .25; } }
    h1 { font-size: 26px; margin: 0 0 10px; letter-spacing: -.02em; }
    p { margin: 0 0 28px; color: #f6e4e8; opacity: .85; line-height: 1.45; }
    button {
      border: 0; cursor: pointer; font: inherit; font-weight: 750;
      background: #f2b53a; color: #3e1621; padding: 14px 28px; border-radius: 999px;
      transition: transform .15s ease;
    }
    button:active { transform: translateY(1px) scale(.98); }
    @media (prefers-reduced-motion: reduce) { .logo, .ombre { animation: none; } }
  </style>
</head>
<body>
  <div class="terrain" aria-hidden="true"></div>
  <main>
    <img class="logo" src="/logo-blanc.png" alt="Ambiance Rugby" />
    <div class="ombre" aria-hidden="true"></div>
    <h1>Ballon perdu en touche</h1>
    <p>Pas de connexion pour l'instant.<br />Vérifie ton réseau et on relance le jeu.</p>
    <button onclick="location.reload()">Réessayer</button>
  </main>
  <script>
    // dès que le réseau revient, on repart au jeu tout seul
    addEventListener("online", () => location.reload());
  </script>
</body>
</html>
